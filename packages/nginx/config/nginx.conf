# HostPanel v3 — Nginx Web Server Configuration
# Isolated configuration for /opt/hostpanel

user www-data;
worker_processes auto;
pid /opt/hostpanel/run/nginx/nginx.pid;
error_log /opt/hostpanel/logs/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /opt/hostpanel/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /opt/hostpanel/logs/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_names_hash_bucket_size 128;
    client_max_body_size 128M;
    server_tokens off;

    # Isolated Temp Paths
    client_body_temp_path /opt/hostpanel/run/nginx/body;
    proxy_temp_path       /opt/hostpanel/run/nginx/proxy;
    fastcgi_temp_path     /opt/hostpanel/run/nginx/fastcgi;
    uwsgi_temp_path       /opt/hostpanel/run/nginx/uwsgi;
    scgi_temp_path        /opt/hostpanel/run/nginx/scgi;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Virtual Hosts & Conf Inclusions
    include /opt/hostpanel/etc/nginx/conf.d/*.conf;
    include /opt/hostpanel/etc/nginx/vhosts/*.conf;
}
