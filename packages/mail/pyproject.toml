[project]
name = "hostpanel-maild"
version = "3.0.0"
requires-python = ">=3.11"
description = "HostPanel v3 — mail package API"
dependencies = ["fastapi", "uvicorn", "hostpanel-portald", "pydantic", "cryptography"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["api"]
include = ["hostpanel_maild*"]
